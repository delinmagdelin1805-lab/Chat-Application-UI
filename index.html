<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Chat Application UI</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Chat Container -->

    <div class="chat-container">

        <!-- Sidebar -->

        <div class="sidebar">

            <h2>
                ChatBox
            </h2>

            <div class="user">

                <img src="https://randomuser.me/api/portraits/men/32.jpg"
                    alt="User">

                <span>John Doe</span>

            </div>

            <div class="user">

                <img src="https://randomuser.me/api/portraits/women/44.jpg"
                    alt="User">

                <span>Emma Smith</span>

            </div>

            <div class="user">

                <img src="https://randomuser.me/api/portraits/men/55.jpg"
                    alt="User">

                <span>David Lee</span>

            </div>

        </div>

        <!-- Chat Section -->

        <div class="chat-section">

            <!-- Header -->

            <div class="chat-header">

                <h3>
                    John Doe
                </h3>

            </div>

            <!-- Messages -->

            <div class="messages">

                <div class="message received">

                    Hello! 👋

                </div>

                <div class="message sent">

                    Hi, how are you?

                </div>

                <div class="message received">

                    I'm doing great! Working on UI designs.

                </div>

                <div class="message sent">

                    Awesome 🔥

                </div>

            </div>

            <!-- Input Area -->

            <div class="input-area">

                <input type="text"
                    placeholder="Type a message...">

                <button>
                    Send
                </button>

            </div>

        </div>

    </div>

</body>

</html>
